name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev,opencv]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  build:
    name: Build package
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: python -m pip install build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/pixel-playground-smoke
          /tmp/pixel-playground-smoke/bin/python -m pip install dist/*.whl
          /tmp/pixel-playground-smoke/bin/pixel-playground --version

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          if-no-files-found: error
