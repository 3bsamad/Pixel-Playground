[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pixel-playground"
version = "0.1.0"
description = "Lightweight computer-vision image and dataset utilities for Python and the command line."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Omar Elshenoudy" },
]
keywords = [
  "computer-vision",
  "image-processing",
  "dataset",
  "opencv",
  "pillow",
  "machine-learning",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.23",
  "Pillow>=9.5",
  "tqdm>=4.64",
]

[project.optional-dependencies]
opencv = [
  "opencv-python-headless>=4.7",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
pixel-playground = "pixel_playground.cli:main"

[project.urls]
Homepage = "https://github.com/3bsamad/Pixel-Playground"
Repository = "https://github.com/3bsamad/Pixel-Playground"
Issues = "https://github.com/3bsamad/Pixel-Playground/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pixel_playground"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
